name: Runtime baseline private preparation and scoped approval
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Fixed operation using installed private runtime baseline configuration.
        type: choice
        required: true
        options: [prepare, approve]
      operation-handle:
        description: Opaque operation registered by the restricted host administrator for this exact job.
        type: string
        required: true
permissions: {}
concurrency:
  group: runtime-baseline-protected-approval
  cancel-in-progress: false
jobs:
  prepare-runtime-baseline:
    name: prepare-runtime-baseline
    if: inputs.operation == 'prepare' && github.ref == 'refs/heads/develop' && github.actor == 'leumor' && github.triggering_actor == 'leumor' && github.run_attempt == 1
    runs-on:
      group: cryptad-restricted-workflows
      labels: [self-hosted, linux, cryptad-restricted-worker]
    environment: runtime-baseline-preparation
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      deployments: read
      attestations: write
      id-token: write
    steps:
      - name: Check exact approved orchestration revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Execute fixed installed prepare helper
        env:
          REGISTERED_HANDLE: ${{ inputs.operation-handle }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_RUN_ATTEMPT" = 1
          public_root="$(mktemp -d "$RUNNER_TEMP/runtime-baseline-public.XXXXXX")"
          echo "RUNTIME_BASELINE_PUBLIC_ROOT=$public_root" >> "$GITHUB_ENV"
          /usr/bin/python3 -I -S /opt/cryptad-cross-version/current/tools/release-certification/protected/restricted_client.py \
            baseline-prepare "$REGISTERED_HANDLE" > "$public_root/runtime-baseline-proposal.json"
      - name: Attest only the opaque public anchor
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.RUNTIME_BASELINE_PUBLIC_ROOT }}/runtime-baseline-proposal.json
      - name: Upload only the opaque public anchor
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-baseline-proposal-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RUNTIME_BASELINE_PUBLIC_ROOT }}/runtime-baseline-proposal.json
          if-no-files-found: error
          overwrite: false
          retention-days: 14
      - name: Remove only the public temporary anchor
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          selected = os.environ.get('RUNTIME_BASELINE_PUBLIC_ROOT')
          if selected:
              path = Path(selected)
              if path.is_symlink() or path.parent.resolve() != Path(os.environ['RUNNER_TEMP']).resolve() or not path.name.startswith('runtime-baseline-public.'):
                  raise SystemExit('runtime_baseline_public_cleanup_ownership_mismatch')
              (path / 'runtime-baseline-proposal.json').unlink(missing_ok=True)
              path.rmdir()
          PY
  approve-runtime-baseline:
    name: approve-runtime-baseline
    if: inputs.operation == 'approve' && github.ref == 'refs/heads/develop' && github.actor == 'leumor' && github.triggering_actor == 'leumor' && github.run_attempt == 1
    runs-on:
      group: cryptad-restricted-workflows
      labels: [self-hosted, linux, cryptad-restricted-worker]
    environment: runtime-baseline-approval
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      deployments: read
      attestations: write
      id-token: write
    steps:
      - name: Check exact approved orchestration revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Execute fixed installed approve helper
        env:
          REGISTERED_HANDLE: ${{ inputs.operation-handle }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$GITHUB_RUN_ATTEMPT" = 1
          public_root="$(mktemp -d "$RUNNER_TEMP/runtime-baseline-public.XXXXXX")"
          echo "RUNTIME_BASELINE_PUBLIC_ROOT=$public_root" >> "$GITHUB_ENV"
          /usr/bin/python3 -I -S /opt/cryptad-cross-version/current/tools/release-certification/protected/restricted_client.py \
            baseline-approve "$REGISTERED_HANDLE" > "$public_root/runtime-baseline-approval.json"
      - name: Attest only the opaque public anchor
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ env.RUNTIME_BASELINE_PUBLIC_ROOT }}/runtime-baseline-approval.json
      - name: Upload only the opaque public anchor
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: runtime-baseline-approval-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.RUNTIME_BASELINE_PUBLIC_ROOT }}/runtime-baseline-approval.json
          if-no-files-found: error
          overwrite: false
          retention-days: 14
      - name: Remove only the public temporary anchor
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          selected = os.environ.get('RUNTIME_BASELINE_PUBLIC_ROOT')
          if selected:
              path = Path(selected)
              if path.is_symlink() or path.parent.resolve() != Path(os.environ['RUNNER_TEMP']).resolve() or not path.name.startswith('runtime-baseline-public.'):
                  raise SystemExit('runtime_baseline_public_cleanup_ownership_mismatch')
              (path / 'runtime-baseline-approval.json').unlink(missing_ok=True)
              path.rmdir()
          PY
