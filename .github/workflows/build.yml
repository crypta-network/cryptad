name: Build cryptad artifacts

on:
  workflow_call:
    inputs:
      git-ref:
        type: string
        default: main
      jdk-version:
        type: string
        default: '25'
      lane:
        type: string
        default: linux-amd64
      run-spotbugs:
        description: Run the complete analyzer cohort required for Phase 12 admission
        type: boolean
        default: true
    outputs:
      artifact-id:
        description: The artifact-id for built cryptad.jar
        value: ${{ jobs.build.outputs.artifact-id }}
    secrets:
      SONAR_TOKEN:
        description: SonarCloud token forwarded from caller
        required: false
jobs:
  build:

    runs-on: ${{ inputs.lane == 'linux-amd64' && 'ubuntu-latest' || inputs.lane == 'macos-arm64' && 'macos-latest' || 'windows-latest' }}
    permissions:
      contents: read
      actions: write # required for actions/cache to reserve/upload caches
      attestations: write
      id-token: write

    # Expose selected secrets as env so we can use them in step `if:`
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      RUN_SPOTBUGS: ${{ inputs.run-spotbugs }}

    outputs:
      artifact-id: ${{ steps.upload-artifact.outputs.artifact-id}}

    steps:
      - name: Validate fixed native lane
        shell: bash
        env:
          PHASE12_LANE: ${{ inputs.lane }}
        run: |
          case "$PHASE12_LANE" in
            linux-amd64|macos-arm64|windows-amd64) ;;
            *) exit 1 ;;
          esac
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: crypta-network/cryptad
          ref: ${{ inputs.git-ref }}
          fetch-depth: 0 # Required for Sonar analysis accuracy

      - name: Set up JDK
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: ${{ inputs.jdk-version }}
          distribution: 'temurin'

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'

      # Cache SonarQube packages to speed up analysis
      - name: Cache SonarQube packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
      # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Install Gradle properties
        uses: ./.github/actions/setup-gradle-properties

      - name: Prepare bounded CI report retention
        shell: bash
        env:
          PYTHONPATH: tools/release-certification
          PYTHON3: ${{ steps.setup-python.outputs.python-path }}
        run: |
          "$PYTHON3" -m cryptad_certification.phase_12_ci --prepare "$RUNNER_TEMP/phase12-report-start.json"

      # Callers can bound routine builds; only full analyzer execution can satisfy admission.
      - name: Build and analyze (Gradle)
        if: ${{ inputs.lane == 'linux-amd64' && env.SONAR_TOKEN != '' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SONAR_TOKEN: ${{ env.SONAR_TOKEN }}
        run: |
          exclusions=()
          if [[ "$RUN_SPOTBUGS" != "true" ]]; then
            exclusions=(-x spotbugsMain -x spotbugsTest)
          fi
          ./gradlew build errorproneReport sonar -Pphase12Evidence=true "${exclusions[@]}" --warning-mode all

      - name: Build (no Sonar token)
        if: ${{ inputs.lane == 'linux-amd64' && env.SONAR_TOKEN == '' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          exclusions=()
          if [[ "$RUN_SPOTBUGS" != "true" ]]; then
            exclusions=(-x spotbugsMain -x spotbugsTest)
          fi
          ./gradlew build errorproneReport -Pphase12Evidence=true "${exclusions[@]}"

      - name: Run native Java verification
        if: ${{ inputs.lane != 'linux-amd64' }}
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          wrapper=./gradlew
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            wrapper=./gradlew.bat
          fi
          tasks=(test)
          if [[ "$RUN_SPOTBUGS" == "true" ]]; then
            tasks+=(spotbugsMain spotbugsTest)
          else
            tasks+=(-x spotbugsMain -x spotbugsTest)
          fi
          "$wrapper" "${tasks[@]}" errorproneReport -Pphase12Evidence=true --continue

      # Failed jobs also retain fixed typed facts. Raw XML, diagnostics, names and payload hashes
      # remain private; authentic failed/incomplete evidence never grants acceptance.
      - name: Retain typed CI test and analyzer facts
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        shell: bash
        env:
          PYTHONPATH: tools/release-certification
          PHASE12_LANE: ${{ inputs.lane }}
          PYTHON3: ${{ steps.setup-python.outputs.python-path }}
        run: |
          "$PYTHON3" -m cryptad_certification.phase_12_ci --retain "$RUNNER_TEMP/phase12-report-facts" --started "$RUNNER_TEMP/phase12-report-start.json" --lane "$PHASE12_LANE"

      - name: Attest exact CI report facts
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/phase12-report-facts/phase-12-ci-reports.json

      - name: Upload bounded CI report facts
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: phase-12-ci-reports-${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.lane }}
          path: ${{ runner.temp }}/phase12-report-facts/phase-12-ci-reports.json
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: false

      - name: Upload cryptad.jar
        if: ${{ success() && inputs.lane == 'linux-amd64' }}
        id: upload-artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cryptad
          path: build/libs/cryptad.jar

      - name: Upload jlink tarball
        if: ${{ success() && inputs.lane == 'linux-amd64' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cryptad-jlink
          path: build/distributions/cryptad-jlink-v*.tar.gz
