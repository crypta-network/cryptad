name: Production Beta Release Pipeline

on:
  pull_request:
    branches: [ main, develop, 'release/**', 'hotfix/**' ]
  push:
    branches: [ 'release/**' ]
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      mode:
        description: Pipeline mode.
        required: true
        default: developer-dry-run
        type: choice
        options:
          - developer-dry-run
          - release-candidate
          - production-beta
      catalog_channel:
        description: Catalog channel for first-party app entries.
        required: true
        default: stable
        type: choice
        options:
          - stable
          - beta
          - nightly
          - deprecated
      require_live_network:
        description: Require live-network beta evidence.
        required: true
        default: false
        type: boolean
      multi_node_mode:
        description: Optional multi-node soak mode override. Leave blank to use the topology config mode.
        required: false
        default: ''
        type: string
      multi_node_soak_config:
        description: Multi-node soak topology config path. Leave blank for PR-safe default; production-beta requires a production config or summary.
        required: false
        default: ''
        type: string
      multi_node_soak_summary:
        description: Existing multi-node soak summary path for protected production promotion.
        required: false
        default: ''
        type: string
      previous_summary:
        description: Previous release-certification summary path for production history and upgrade evidence.
        required: false
        default: ''
        type: string
      waiver_file:
        description: Optional structured go/no-go waiver file path. Production-beta cannot waive mandatory launch evidence.
        required: false
        default: ''
        type: string
      require_multi_node_soak:
        description: Require multi-node beta soak evidence.
        required: true
        default: false
        type: boolean
      artifact_base_uri:
        description: Public base URI where staged app bundles will be published.
        required: false
        default: ''
        type: string

jobs:
  dry-run-or-release-candidate:
    if: github.event_name != 'workflow_dispatch' || inputs.mode != 'production-beta'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      actions: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@f29f5a9d7b09a7c6b29859002d29d24e1674c884 # v5

      - name: Run production beta pipeline self-test
        run: python3 tools/release-certification/production_beta_release.py --self-test

      - name: Run CI-safe production beta pipeline
        env:
          INPUT_MODE: ${{ inputs.mode || '' }}
          INPUT_CATALOG_CHANNEL: ${{ inputs.catalog_channel || 'stable' }}
          INPUT_REQUIRE_LIVE_NETWORK: ${{ inputs.require_live_network || 'false' }}
          INPUT_MULTI_NODE_MODE: ${{ inputs.multi_node_mode || '' }}
          INPUT_MULTI_NODE_SOAK_CONFIG: ${{ inputs.multi_node_soak_config || 'tools/release-certification/fixtures/self-test-multi-node-beta-soak.json' }}
          INPUT_MULTI_NODE_SOAK_SUMMARY: ${{ inputs.multi_node_soak_summary || '' }}
          INPUT_PREVIOUS_SUMMARY: ${{ inputs.previous_summary || '' }}
          INPUT_WAIVER_FILE: ${{ inputs.waiver_file || '' }}
          INPUT_REQUIRE_MULTI_NODE_SOAK: ${{ inputs.require_multi_node_soak || 'false' }}
          INPUT_ARTIFACT_BASE_URI: ${{ inputs.artifact_base_uri || vars.CRYPTAD_PRODUCTION_BETA_ARTIFACT_BASE_URI || (github.event_name != 'pull_request' && secrets.CRYPTAD_PRODUCTION_BETA_ARTIFACT_BASE_URI) || '' }}
          CRYPTAD_CERT_NODE_BASE_URL: ${{ github.event_name == 'workflow_dispatch' && inputs.require_live_network && secrets.CRYPTAD_CERT_NODE_BASE_URL || '' }}
          CRYPTAD_CERT_FORM_PASSWORD: ${{ github.event_name == 'workflow_dispatch' && inputs.require_live_network && secrets.CRYPTAD_CERT_FORM_PASSWORD || '' }}
          CRYPTAD_CERT_LIVE_CATALOG_SOURCE: ${{ github.event_name == 'workflow_dispatch' && inputs.require_live_network && secrets.CRYPTAD_CERT_LIVE_CATALOG_SOURCE || '' }}
          CRYPTAD_CERT_LIVE_CATALOG_EXPECTED_KEY_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.require_live_network && secrets.CRYPTAD_CERT_LIVE_CATALOG_EXPECTED_KEY_ID || '' }}
          CRYPTAD_CERT_LIVE_CATALOG_ID: ${{ github.event_name == 'workflow_dispatch' && inputs.require_live_network && secrets.CRYPTAD_CERT_LIVE_CATALOG_ID || '' }}
          CRYPTAD_CERT_LIVE_CONTENT_FETCH_URI: ${{ github.event_name == 'workflow_dispatch' && inputs.require_live_network && secrets.CRYPTAD_CERT_LIVE_CONTENT_FETCH_URI || '' }}
          CRYPTAD_CERT_LIVE_FEED_USK_URI: ${{ github.event_name == 'workflow_dispatch' && inputs.require_live_network && secrets.CRYPTAD_CERT_LIVE_FEED_USK_URI || '' }}
          CRYPTAD_CERT_LIVE_PROFILE_PUBLIC_URI: ${{ github.event_name == 'workflow_dispatch' && inputs.require_live_network && secrets.CRYPTAD_CERT_LIVE_PROFILE_PUBLIC_URI || '' }}
          CRYPTAD_CERT_LIVE_TRUST_PUBLIC_URI: ${{ github.event_name == 'workflow_dispatch' && inputs.require_live_network && secrets.CRYPTAD_CERT_LIVE_TRUST_PUBLIC_URI || '' }}
          CRYPTAD_CERT_LIVE_TEST_INSERT_URI: ${{ github.event_name == 'workflow_dispatch' && inputs.require_live_network && secrets.CRYPTAD_CERT_LIVE_TEST_INSERT_URI || '' }}
        run: |
          mode="$INPUT_MODE"
          if [[ -z "$mode" ]]; then
            if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
              mode="developer-dry-run"
            else
              mode="release-candidate"
            fi
          fi

          args=(
            --workspace-root .
            --out-dir build/production-beta-release
            --mode "$mode"
            --catalog-channel "$INPUT_CATALOG_CHANNEL"
          )

          if [[ -n "$INPUT_MULTI_NODE_MODE" ]]; then
            args+=(--multi-node-mode "$INPUT_MULTI_NODE_MODE")
          fi

          if [[ -n "$INPUT_MULTI_NODE_SOAK_SUMMARY" ]]; then
            args+=(--multi-node-soak-summary "$INPUT_MULTI_NODE_SOAK_SUMMARY")
          else
            args+=(--run-multi-node-soak)
          fi

          if [[ -z "$INPUT_MULTI_NODE_SOAK_SUMMARY" && -n "$INPUT_MULTI_NODE_SOAK_CONFIG" ]]; then
            args+=(--multi-node-soak-config "$INPUT_MULTI_NODE_SOAK_CONFIG")
          fi

          if [[ "$mode" == "developer-dry-run" ]]; then
            args+=(--allow-dirty-workspace)
          fi

          if [[ "$INPUT_REQUIRE_LIVE_NETWORK" == "true" ]]; then
            args+=(--require-live-network)
            if [[ -n "${CRYPTAD_CERT_LIVE_TEST_INSERT_URI:-}" ]]; then
              export CRYPTAD_CERT_LIVE_TEST_INSERT_URI_ENV=CRYPTAD_CERT_LIVE_TEST_INSERT_URI
            fi
          fi

          if [[ "$INPUT_REQUIRE_MULTI_NODE_SOAK" == "true" ]]; then
            args+=(--require-multi-node-soak)
          fi
          if [[ -n "$INPUT_PREVIOUS_SUMMARY" ]]; then
            args+=(--previous-summary "$INPUT_PREVIOUS_SUMMARY")
          fi
          if [[ -n "$INPUT_WAIVER_FILE" ]]; then
            args+=(--waiver-file "$INPUT_WAIVER_FILE")
          fi

          if [[ -n "$INPUT_ARTIFACT_BASE_URI" ]]; then
            args+=(--artifact-base-uri "$INPUT_ARTIFACT_BASE_URI")
          elif [[ "$mode" != "developer-dry-run" ]]; then
            echo "::error::CRYPTAD_PRODUCTION_BETA_ARTIFACT_BASE_URI or workflow artifact_base_uri input is required for $mode."
            exit 1
          fi

          tools/release-certification/run-production-beta-release.sh "${args[@]}"

      - name: Read production beta redaction status
        id: redaction
        if: always()
        run: |
          status="$(python3 - <<'PY'
          import json
          from pathlib import Path

          summary = Path("build/production-beta-release/reports/production-beta-summary.json")
          try:
              data = json.loads(summary.read_text(encoding="utf-8"))
              print(data.get("redaction", {}).get("status") or "missing")
          except Exception:
              print("missing")
          PY
          )"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "Production beta redaction status: $status"

      - name: Read go/no-go dashboard redaction status
        id: go_no_go_redaction
        if: always()
        run: |
          status="$(python3 - <<'PY'
          import json
          from pathlib import Path

          report = Path("build/production-beta-release/reports/go-no-go-redaction-report.json")
          try:
              data = json.loads(report.read_text(encoding="utf-8"))
              print(data.get("status") or "missing")
          except Exception:
              print("missing")
          PY
          )"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "Go/no-go dashboard redaction status: $status"

      - name: Publish go/no-go dashboard summary
        if: always() && steps.redaction.outputs.status == 'pass' && steps.go_no_go_redaction.outputs.status == 'pass'
        run: |
          if [[ -f build/production-beta-release/reports/go-no-go-dashboard.md ]]; then
            cat build/production-beta-release/reports/go-no-go-dashboard.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload production beta dry-run artifacts
        if: always() && steps.redaction.outputs.status == 'pass' && steps.go_no_go_redaction.outputs.status == 'pass'
        uses: actions/upload-artifact@v6
        with:
          name: production-beta-pipeline-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/production-beta-release/
            !**/private-insert-uris.json
            !**/.DS_Store
            !**/._*
            !**/__MACOSX/**
          if-no-files-found: warn
          retention-days: 30

  production-beta:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'production-beta'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment: production-beta
    permissions:
      contents: read
      actions: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@f29f5a9d7b09a7c6b29859002d29d24e1674c884 # v5

      - name: Run production beta pipeline self-test
        run: python3 tools/release-certification/production_beta_release.py --self-test

      - name: Build production beta candidate
        env:
          CRYPTAD_APP_SIGNING_KEY_ID: ${{ secrets.CRYPTAD_APP_SIGNING_KEY_ID }}
          CRYPTAD_APP_SIGNING_PRIVATE_KEY_FILE: ${{ secrets.CRYPTAD_APP_SIGNING_PRIVATE_KEY_FILE }}
          CRYPTAD_APP_SIGNING_PRIVATE_KEY_BASE64: ${{ secrets.CRYPTAD_APP_SIGNING_PRIVATE_KEY_BASE64 }}
          CRYPTAD_APP_SIGNING_PUBLIC_KEY_FILE: ${{ secrets.CRYPTAD_APP_SIGNING_PUBLIC_KEY_FILE }}
          CRYPTAD_APP_SIGNING_PUBLIC_KEY_BASE64: ${{ secrets.CRYPTAD_APP_SIGNING_PUBLIC_KEY_BASE64 }}
          CRYPTAD_APP_REVIEWER_KEY_ID: ${{ secrets.CRYPTAD_APP_REVIEWER_KEY_ID }}
          CRYPTAD_APP_REVIEWER_PRIVATE_KEY_FILE: ${{ secrets.CRYPTAD_APP_REVIEWER_PRIVATE_KEY_FILE }}
          CRYPTAD_APP_REVIEWER_PRIVATE_KEY_BASE64: ${{ secrets.CRYPTAD_APP_REVIEWER_PRIVATE_KEY_BASE64 }}
          CRYPTAD_APP_REVIEWER_PUBLIC_KEY_FILE: ${{ secrets.CRYPTAD_APP_REVIEWER_PUBLIC_KEY_FILE }}
          CRYPTAD_APP_REVIEWER_PUBLIC_KEY_BASE64: ${{ secrets.CRYPTAD_APP_REVIEWER_PUBLIC_KEY_BASE64 }}
          CRYPTAD_APP_REVIEW_POLICY_ID: ${{ secrets.CRYPTAD_APP_REVIEW_POLICY_ID }}
          CRYPTAD_APP_REVIEW_POLICY_VERSION: ${{ secrets.CRYPTAD_APP_REVIEW_POLICY_VERSION }}
          CRYPTAD_CERT_NODE_BASE_URL: ${{ secrets.CRYPTAD_CERT_NODE_BASE_URL }}
          CRYPTAD_CERT_FORM_PASSWORD: ${{ secrets.CRYPTAD_CERT_FORM_PASSWORD }}
          CRYPTAD_CERT_LIVE_CATALOG_SOURCE: ${{ secrets.CRYPTAD_CERT_LIVE_CATALOG_SOURCE }}
          CRYPTAD_CERT_LIVE_CATALOG_EXPECTED_KEY_ID: ${{ secrets.CRYPTAD_CERT_LIVE_CATALOG_EXPECTED_KEY_ID }}
          CRYPTAD_CERT_LIVE_CATALOG_ID: ${{ secrets.CRYPTAD_CERT_LIVE_CATALOG_ID }}
          CRYPTAD_CERT_LIVE_CONTENT_FETCH_URI: ${{ secrets.CRYPTAD_CERT_LIVE_CONTENT_FETCH_URI }}
          CRYPTAD_CERT_LIVE_FEED_USK_URI: ${{ secrets.CRYPTAD_CERT_LIVE_FEED_USK_URI }}
          CRYPTAD_CERT_LIVE_PROFILE_PUBLIC_URI: ${{ secrets.CRYPTAD_CERT_LIVE_PROFILE_PUBLIC_URI }}
          CRYPTAD_CERT_LIVE_TRUST_PUBLIC_URI: ${{ secrets.CRYPTAD_CERT_LIVE_TRUST_PUBLIC_URI }}
          CRYPTAD_CERT_LIVE_TEST_INSERT_URI: ${{ secrets.CRYPTAD_CERT_LIVE_TEST_INSERT_URI }}
          INPUT_ARTIFACT_BASE_URI: ${{ inputs.artifact_base_uri || vars.CRYPTAD_PRODUCTION_BETA_ARTIFACT_BASE_URI || secrets.CRYPTAD_PRODUCTION_BETA_ARTIFACT_BASE_URI || '' }}
          INPUT_MULTI_NODE_MODE: ${{ inputs.multi_node_mode || '' }}
          INPUT_MULTI_NODE_SOAK_CONFIG: ${{ inputs.multi_node_soak_config || '' }}
          INPUT_MULTI_NODE_SOAK_SUMMARY: ${{ inputs.multi_node_soak_summary || '' }}
          INPUT_PREVIOUS_SUMMARY: ${{ inputs.previous_summary || '' }}
          INPUT_WAIVER_FILE: ${{ inputs.waiver_file || '' }}
        run: |
          materialize_secret_file() {
            local encoded="$1"
            local env_name="$2"
            local file_name="$3"
            if [[ -z "$encoded" ]]; then
              return 0
            fi
            local path="$RUNNER_TEMP/cryptad-production-beta-secrets/$file_name"
            mkdir -p "$(dirname "$path")"
            printf '%s' "$encoded" | base64 --decode > "$path"
            chmod 600 "$path"
            export "$env_name=$path"
          }

          require_env() {
            local name="$1"
            local description="$2"
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$description ($name) is required for production-beta."
              exit 1
            fi
          }

          require_file() {
            local path="$1"
            local description="$2"
            if [[ -z "$path" || ! -f "$path" ]]; then
              echo "::error::$description must point to a readable file: $path"
              exit 1
            fi
          }

          materialize_secret_file "${CRYPTAD_APP_SIGNING_PRIVATE_KEY_BASE64:-}" CRYPTAD_APP_SIGNING_PRIVATE_KEY_FILE app-signing-private.der
          materialize_secret_file "${CRYPTAD_APP_SIGNING_PUBLIC_KEY_BASE64:-}" CRYPTAD_APP_SIGNING_PUBLIC_KEY_FILE app-signing-public.der
          materialize_secret_file "${CRYPTAD_APP_REVIEWER_PRIVATE_KEY_BASE64:-}" CRYPTAD_APP_REVIEWER_PRIVATE_KEY_FILE reviewer-private.der
          materialize_secret_file "${CRYPTAD_APP_REVIEWER_PUBLIC_KEY_BASE64:-}" CRYPTAD_APP_REVIEWER_PUBLIC_KEY_FILE reviewer-public.der

          if [[ -z "$INPUT_ARTIFACT_BASE_URI" ]]; then
            echo "::error::CRYPTAD_PRODUCTION_BETA_ARTIFACT_BASE_URI or workflow artifact_base_uri input is required for production-beta."
            exit 1
          fi
          require_env CRYPTAD_APP_SIGNING_KEY_ID "App signing key ID"
          require_file "${CRYPTAD_APP_SIGNING_PRIVATE_KEY_FILE:-}" "App signing private key"
          require_file "${CRYPTAD_APP_SIGNING_PUBLIC_KEY_FILE:-}" "App signing public key"
          require_env CRYPTAD_APP_REVIEWER_KEY_ID "App reviewer key ID"
          require_file "${CRYPTAD_APP_REVIEWER_PRIVATE_KEY_FILE:-}" "Reviewer private key"
          require_file "${CRYPTAD_APP_REVIEWER_PUBLIC_KEY_FILE:-}" "Reviewer public key"
          require_env CRYPTAD_APP_REVIEW_POLICY_ID "App review policy ID"
          require_env CRYPTAD_APP_REVIEW_POLICY_VERSION "App review policy version"
          require_env CRYPTAD_CERT_NODE_BASE_URL "Live-node base URL"
          require_env CRYPTAD_CERT_FORM_PASSWORD "Live-node form password"
          require_env CRYPTAD_CERT_LIVE_CATALOG_SOURCE "Live catalog source URI"
          require_env CRYPTAD_CERT_LIVE_CATALOG_EXPECTED_KEY_ID "Live catalog expected signing key ID"
          require_env CRYPTAD_CERT_LIVE_CATALOG_ID "Live catalog ID"
          require_env CRYPTAD_CERT_LIVE_CONTENT_FETCH_URI "Live content fetch URI"
          require_env CRYPTAD_CERT_LIVE_FEED_USK_URI "Live feed USK URI"
          require_env CRYPTAD_CERT_LIVE_PROFILE_PUBLIC_URI "Live profile public URI"
          require_env CRYPTAD_CERT_LIVE_TRUST_PUBLIC_URI "Live trust statement public URI"
          if [[ -z "${CRYPTAD_CERT_LIVE_TEST_INSERT_URI:-}" ]]; then
            echo "::error::CRYPTAD_CERT_LIVE_TEST_INSERT_URI secret is required for production-beta live profile/trust evidence."
            exit 1
          fi
          export CRYPTAD_CERT_LIVE_TEST_INSERT_URI_ENV=CRYPTAD_CERT_LIVE_TEST_INSERT_URI

          self_test_multi_node_config="tools/release-certification/fixtures/self-test-multi-node-beta-soak.json"
          if [[ -z "$INPUT_PREVIOUS_SUMMARY" ]]; then
            echo "::error::production-beta requires previous_summary pointing to the previous release-certification summary."
            exit 1
          fi
          require_file "$INPUT_PREVIOUS_SUMMARY" "Previous release-certification summary"
          if [[ -z "$INPUT_MULTI_NODE_SOAK_SUMMARY" && -z "$INPUT_MULTI_NODE_SOAK_CONFIG" ]]; then
            echo "::error::production-beta requires multi_node_soak_summary or a production multi_node_soak_config."
            exit 1
          fi
          if [[ -n "$INPUT_MULTI_NODE_SOAK_SUMMARY" ]]; then
            require_file "$INPUT_MULTI_NODE_SOAK_SUMMARY" "Multi-node soak summary"
          fi
          if [[ -n "$INPUT_MULTI_NODE_SOAK_CONFIG" ]]; then
            require_file "$INPUT_MULTI_NODE_SOAK_CONFIG" "Multi-node soak topology config"
          fi
          if [[ -z "$INPUT_MULTI_NODE_SOAK_SUMMARY" && "$INPUT_MULTI_NODE_SOAK_CONFIG" == "$self_test_multi_node_config" ]]; then
            echo "::error::production-beta cannot use the self-test multi-node soak topology as required promotion evidence."
            exit 1
          fi
          if [[ "$INPUT_MULTI_NODE_MODE" == "simulated" ]]; then
            echo "::error::production-beta cannot use simulated multi-node mode as required promotion evidence."
            exit 1
          fi
          if [[ -n "$INPUT_WAIVER_FILE" ]]; then
            require_file "$INPUT_WAIVER_FILE" "Go/no-go waiver file"
          fi

          args=(
            tools/release-certification/run-production-beta-release.sh
            --workspace-root .
            --out-dir build/production-beta-release
            --mode production-beta
            --catalog-channel "${{ inputs.catalog_channel }}"
            --artifact-base-uri "$INPUT_ARTIFACT_BASE_URI"
            --require-multi-node-soak
            --require-live-network
            --require-sandbox-provider-tests
            --previous-summary "$INPUT_PREVIOUS_SUMMARY"
          )
          if [[ -n "$INPUT_MULTI_NODE_SOAK_SUMMARY" ]]; then
            args+=(--multi-node-soak-summary "$INPUT_MULTI_NODE_SOAK_SUMMARY")
          else
            args+=(--run-multi-node-soak --multi-node-soak-config "$INPUT_MULTI_NODE_SOAK_CONFIG")
          fi
          if [[ -n "$INPUT_MULTI_NODE_MODE" ]]; then
            args+=(--multi-node-mode "$INPUT_MULTI_NODE_MODE")
          fi
          if [[ -n "$INPUT_WAIVER_FILE" ]]; then
            args+=(--waiver-file "$INPUT_WAIVER_FILE")
          fi
          "${args[@]}"

      - name: Read production beta redaction status
        id: redaction
        if: always()
        run: |
          status="$(python3 - <<'PY'
          import json
          from pathlib import Path

          summary = Path("build/production-beta-release/reports/production-beta-summary.json")
          try:
              data = json.loads(summary.read_text(encoding="utf-8"))
              print(data.get("redaction", {}).get("status") or "missing")
          except Exception:
              print("missing")
          PY
          )"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "Production beta redaction status: $status"

      - name: Read go/no-go dashboard redaction status
        id: go_no_go_redaction
        if: always()
        run: |
          status="$(python3 - <<'PY'
          import json
          from pathlib import Path

          report = Path("build/production-beta-release/reports/go-no-go-redaction-report.json")
          try:
              data = json.loads(report.read_text(encoding="utf-8"))
              print(data.get("status") or "missing")
          except Exception:
              print("missing")
          PY
          )"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "Go/no-go dashboard redaction status: $status"

      - name: Publish go/no-go dashboard summary
        if: always() && steps.redaction.outputs.status == 'pass' && steps.go_no_go_redaction.outputs.status == 'pass'
        run: |
          if [[ -f build/production-beta-release/reports/go-no-go-dashboard.md ]]; then
            cat build/production-beta-release/reports/go-no-go-dashboard.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload production beta artifacts
        if: always() && steps.redaction.outputs.status == 'pass' && steps.go_no_go_redaction.outputs.status == 'pass'
        uses: actions/upload-artifact@v6
        with:
          name: production-beta-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/production-beta-release/
            !**/private-insert-uris.json
            !**/.DS_Store
            !**/._*
            !**/__MACOSX/**
          if-no-files-found: warn
          retention-days: 30
