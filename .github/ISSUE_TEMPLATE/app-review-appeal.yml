name: App review appeal or resubmission
description: Request reviewer clarification or document a beta resubmission.
title: "[app-review-appeal] "
labels:
  - app-platform
  - app-submission
  - area/third-party-review
  - status/needs-repro
  - privacy/redaction-required
body:
  - type: markdown
    attributes:
      value: |
        Use docs/public-beta/support-and-feedback.md for public beta feedback routing and docs/public-beta/feedback-to-backlog.md for backlog linkage.

        Do not paste reviewer private keys, app signing private keys, private insert URIs, browser session tokens, app tokens, authorization headers, cookies, form passwords, raw rationale bodies, raw app data, raw fetched content, raw support bundles, raw receipt signatures, request or response bodies, or local absolute paths.
  - type: input
    id: release_id
    attributes:
      label: Release id
    validations:
      required: true
  - type: input
    id: cryptad_version
    attributes:
      label: Cryptad version/build
  - type: input
    id: app_id
    attributes:
      label: App id
      placeholder: "Example: org.example.hello"
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: App version
      placeholder: "Example: 0.1.0"
    validations:
      required: true
  - type: input
    id: platform_api_contract_version
    attributes:
      label: Platform API contract version
  - type: input
    id: submission-id
    attributes:
      label: Submission id
      placeholder: "Example: sub-0123456789abcdef01234567"
    validations:
      required: true
  - type: dropdown
    id: current-review-status
    attributes:
      label: Current review status
      options:
        - caution
        - rejected
        - resubmitted
    validations:
      required: true
  - type: input
    id: resubmission-of
    attributes:
      label: Resubmission of
      placeholder: "Previous submission id, when applicable"
  - type: input
    id: support_bundle_digest
    attributes:
      label: Support bundle digest, if relevant
  - type: input
    id: diagnostic_summary_id
    attributes:
      label: Diagnostic summary id, if relevant
  - type: input
    id: known_issue_id
    attributes:
      label: Known issue id, if relevant
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - severity/blocker
        - severity/high
        - severity/medium
        - severity/low
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact
    validations:
      required: true
  - type: textarea
    id: finding-summary
    attributes:
      label: Finding summary
      description: Summarize reviewer findings or pre-review blocker ids without raw private material.
    validations:
      required: true
  - type: textarea
    id: author-response
    attributes:
      label: Author response or resubmission delta
      description: Describe changed permissions, API target, UI fixes, data migration notes, or redaction fixes.
    validations:
      required: true
  - type: textarea
    id: reproduction_steps
    attributes:
      label: Redacted reproduction steps, if relevant
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior, if relevant
  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual behavior, if relevant
  - type: textarea
    id: redacted_evidence
    attributes:
      label: Redacted evidence
      description: Include finding ids, decision metadata, and digests only.
  - type: checkboxes
    id: redaction-confirmation
    attributes:
      label: Redaction confirmation
      options:
        - label: I confirm this appeal contains no secrets, private URIs, tokens, raw app data, raw fetched content, raw support bundles, raw signatures, request or response bodies, or unredacted local absolute paths.
          required: true
