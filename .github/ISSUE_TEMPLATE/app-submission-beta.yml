name: App submission beta
description: Propose a Crypta app for beta review.
title: "[app-submission-beta] "
labels:
  - app-platform
  - app-submission
  - area/third-party-review
  - status/needs-repro
  - privacy/redaction-required
body:
  - type: markdown
    attributes:
      value: |
        Public beta support and review feedback flows are in docs/public-beta/support-and-feedback.md and docs/public-beta/feedback-to-backlog.md.

        Do not paste private keys, reviewer private keys, app signing private keys, seed phrases, private insert URIs, browser session tokens, app tokens, AppHost process tokens, form passwords, authorization headers, cookies, request bodies, response bodies, raw fetched content, raw feed bodies, raw profile documents, raw trust statements, raw social messages, raw app data values, raw support bundles, raw receipt signatures, or local absolute paths.
        Use `docs/third-party-app-submission-checklist.md`, `docs/third-party-developer-beta-program.md`, `docs/app-store-submission-and-review-workflow.md`, and `docs/platform-api-compatibility-support-window.md` before filing.
  - type: input
    id: release_id
    attributes:
      label: Release id
      placeholder: "Example: cryptad-beta-1500"
    validations:
      required: true
  - type: input
    id: cryptad_version
    attributes:
      label: Cryptad version/build
    validations:
      required: true
  - type: input
    id: app-id-name-version
    attributes:
      label: App id/name/version
      placeholder: "Example: hello-crypta / Hello Crypta / 0.1.0"
    validations:
      required: true
  - type: input
    id: app_id
    attributes:
      label: App id
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: App version
    validations:
      required: true
  - type: input
    id: submission-id
    attributes:
      label: Submission package id
      placeholder: "Example: sub-0123456789abcdef01234567"
    validations:
      required: true
  - type: dropdown
    id: submission-type
    attributes:
      label: Submission type
      options:
        - new_app
        - update
        - resubmission
    validations:
      required: true
  - type: input
    id: resubmission-of
    attributes:
      label: Resubmission of
      placeholder: "Previous submission id when this is a resubmission"
  - type: input
    id: submission-digest
    attributes:
      label: Submission package digest
      placeholder: "Lowercase SHA-256 digest of submission.zip"
    validations:
      required: true
  - type: input
    id: lineage
    attributes:
      label: Template or reference app lineage
      placeholder: "Example: hello-stable, static-basic, queue-dashboard, publisher, vault-profile, or custom"
  - type: input
    id: platform_api_contract_version
    attributes:
      label: Platform API contract version
      placeholder: "Example: 1.0"
    validations:
      required: true
  - type: dropdown
    id: api-target-stability
    attributes:
      label: API target stability
      options:
        - stable
        - experimental
    validations:
      required: true
  - type: dropdown
    id: experimental-capabilities-accepted
    attributes:
      label: Experimental capabilities accepted
      options:
        - "false"
        - "true"
    validations:
      required: true
  - type: dropdown
    id: legacy-migration-lineage
    attributes:
      label: Legacy plugin migration lineage
      options:
        - none
        - WebOfTrust-like
        - Freetalk/Sone-like
        - Freemail-like
        - content publishing
        - queue/insert-helper
        - other legacy plugin migration
  - type: textarea
    id: capabilities
    attributes:
      label: Requested capabilities
      description: List capability names from the manifest.
      placeholder: "queue.read, queue.write"
    validations:
      required: true
  - type: textarea
    id: rationales
    attributes:
      label: Permission rationales
      description: Explain why each requested capability is needed.
    validations:
      required: true
  - type: input
    id: api-range
    attributes:
      label: API min/max tested version
      placeholder: "Example: minimum 19, maximum tested 22"
    validations:
      required: true
  - type: dropdown
    id: pre-review-status
    attributes:
      label: Automated pre-review status
      options:
        - pass
        - warn
        - fail
    validations:
      required: true
  - type: input
    id: pre-review-digest
    attributes:
      label: Pre-review report digest
      placeholder: "Lowercase SHA-256 digest of example-pre-review.json"
    validations:
      required: true
  - type: input
    id: support_bundle_digest
    attributes:
      label: Support bundle digest, if relevant
  - type: input
    id: diagnostic_summary_id
    attributes:
      label: Diagnostic summary id, if relevant
  - type: input
    id: known_issue_id
    attributes:
      label: Known issue id, if relevant
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - severity/blocker
        - severity/high
        - severity/medium
        - severity/low
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: Describe reviewer or user impact without private material.
    validations:
      required: true
  - type: input
    id: bundle-digest
    attributes:
      label: Signed bundle digest
      placeholder: "Lowercase SHA-256 digest, no private material"
    validations:
      required: true
  - type: textarea
    id: catalog-entry
    attributes:
      label: Catalog entry digest or descriptor excerpt
      description: Include only safe descriptor fields such as app id, version, digest, size, capability names, and redacted URIs.
    validations:
      required: true
  - type: dropdown
    id: review-receipt
    attributes:
      label: Reviewer decision / receipt status
      options:
        - submitted
        - pre_review_passed
        - reviewed receipt issued
        - caution receipt issued
        - rejected metadata recorded
        - resubmitted
    validations:
      required: true
  - type: input
    id: ui-lint
    attributes:
      label: UI lint status
      placeholder: "Example: crypta-app ui lint --strict passed"
    validations:
      required: true
  - type: input
    id: compatibility
    attributes:
      label: Compatibility status
      placeholder: "Example: crypta-app compat verify --strict passed against contract v22"
    validations:
      required: true
  - type: textarea
    id: update-policy
    attributes:
      label: Update policy expectations
      description: Describe permission deltas, review requirements, and whether manual review is expected.
  - type: textarea
    id: limitations
    attributes:
      label: Known limitations
      description: Be explicit about beta limits and unsupported behavior.
    validations:
      required: true
  - type: textarea
    id: reproduction_steps
    attributes:
      label: Redacted reproduction steps, if relevant
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior, if relevant
  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual behavior, if relevant
  - type: textarea
    id: redacted_evidence
    attributes:
      label: Redacted evidence
      description: Include review finding ids, digests, and public-safe descriptor fields only.
  - type: textarea
    id: security-notes
    attributes:
      label: Security notes
      description: Describe data handling, capability boundaries, and redaction-sensitive areas.
    validations:
      required: true
  - type: input
    id: transparency-log
    attributes:
      label: Transparency log fingerprint/status
      placeholder: "Example: hash-chain verified, latest hash abc..."
  - type: checkboxes
    id: redaction-confirmation
    attributes:
      label: Redaction confirmation
      options:
        - label: I confirm this submission does not include private keys, tokens, private URIs, request bodies, response bodies, raw user documents, raw app data, raw support bundles, raw signatures, or unredacted local absolute paths.
          required: true
