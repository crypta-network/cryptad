name: Developer beta feedback
description: Report third-party developer beta workflow feedback.
title: "[developer-beta] "
labels:
  - app-platform
  - beta-feedback
  - developer-beta
  - area/platform-api
  - status/needs-repro
  - privacy/redaction-required
body:
  - type: markdown
    attributes:
      value: |
        Start with docs/public-beta/support-and-feedback.md and docs/public-beta/feedback-to-backlog.md before filing developer feedback.

        Do not paste private keys, reviewer private keys, app signing private keys, seed phrases, private insert URIs, browser session tokens, app tokens, AppHost process tokens, form passwords, authorization headers, cookies, request bodies, response bodies, raw fetched content, raw app data, raw support bundles, raw signatures, or local absolute paths.
  - type: input
    id: release_id
    attributes:
      label: Release id
      placeholder: "Example: cryptad-beta-1500"
    validations:
      required: true
  - type: input
    id: cryptad_version
    attributes:
      label: Cryptad version/build
    validations:
      required: true
  - type: dropdown
    id: workflow-step
    attributes:
      label: Workflow step
      options:
        - read public docs
        - crypta-app init/template
        - local dev/test
        - UI lint
        - API compatibility verify
        - submission create/verify
        - pre-review
        - review decision
        - catalog candidate
        - feedback/resubmission
    validations:
      required: true
  - type: input
    id: app-template
    attributes:
      label: Template or sample
      placeholder: "Example: hello-stable"
  - type: input
    id: app_id
    attributes:
      label: App id, if relevant
  - type: input
    id: app_version
    attributes:
      label: App version, if relevant
  - type: input
    id: platform_api_contract_version
    attributes:
      label: Platform API contract version
      placeholder: "Example: 22"
  - type: input
    id: support_bundle_digest
    attributes:
      label: Support bundle digest, if relevant
  - type: input
    id: diagnostic_summary_id
    attributes:
      label: Diagnostic summary id, if relevant
  - type: input
    id: known_issue_id
    attributes:
      label: Known issue id, if relevant
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - severity/blocker
        - severity/high
        - severity/medium
        - severity/low
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem or feedback
      description: Use redacted command summaries, status values, and digests instead of raw artifacts.
    validations:
      required: true
  - type: textarea
    id: reproduction_steps
    attributes:
      label: Redacted reproduction steps
      description: Include command names, status codes, and finding ids only.
  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual_behavior
    attributes:
      label: Actual behavior
  - type: textarea
    id: redacted_evidence
    attributes:
      label: Redacted evidence
      description: Include finding ids, command summaries, digests, or status values only.
  - type: checkboxes
    id: redaction-confirmation
    attributes:
      label: Redaction confirmation
      options:
        - label: I confirm this report contains no secrets, private URIs, tokens, raw app data, raw fetched content, raw support bundles, raw signatures, request or response bodies, or unredacted local absolute paths.
          required: true
