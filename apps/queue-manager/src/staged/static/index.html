<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Queue Manager</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">Cryptad app</p>
        <h1>Queue Manager</h1>
      </div>
      <button class="button secondary" id="refresh-button" type="button">Refresh</button>
    </header>

    <section class="toolbar" aria-label="Queue view">
      <div class="tabs" role="tablist" aria-label="Queue page">
        <button class="tab active" id="downloads-tab" type="button" role="tab" aria-selected="true">
          Downloads
        </button>
        <button class="tab" id="uploads-tab" type="button" role="tab" aria-selected="false">
          Uploads
        </button>
      </div>
    </section>

    <section class="download-panel" id="download-panel">
      <form class="direct-download" id="direct-download-form">
        <label>
          <span>Fetch URI</span>
          <input name="fetchUri" type="text" autocomplete="off" spellcheck="false" required>
        </label>
        <label>
          <span>Expected MIME type</span>
          <input name="expectedMimeType" type="text" autocomplete="off" spellcheck="false">
        </label>
        <label class="checkbox">
          <input name="filterData" type="checkbox" checked>
          <span>Filter data</span>
        </label>
        <button class="button primary" type="submit">Queue download</button>
      </form>
    </section>

    <p class="status" id="status" role="status" aria-live="polite"></p>
    <section class="queue-content" id="queue-content">
      <p class="empty">Loading queue snapshot...</p>
    </section>
  </main>
  <script src="./crypta-platform.js" defer></script>
  <script src="./app.js" defer></script>
</body>
</html>
