<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Publisher</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div>
        <p class="eyebrow">Cryptad app</p>
        <h1>Publisher</h1>
      </div>
      <button class="button secondary" id="upload-queue-button" type="button">Upload queue</button>
    </header>

    <section class="forms">
      <form class="publish-form" id="file-form" data-source-type="file">
        <h2>Local file insert</h2>
        <label>
          <span>Source path</span>
          <input name="sourcePath" type="text" autocomplete="off" spellcheck="false" required>
        </label>
        <label>
          <span>Insert URI</span>
          <input name="insertUri" type="text" autocomplete="off" spellcheck="false" required>
        </label>
        <label>
          <span>Identifier</span>
          <input name="identifier" type="text" autocomplete="off" spellcheck="false">
        </label>
        <label>
          <span>Compatibility mode</span>
          <input name="compatibilityMode" type="text" value="COMPAT_CURRENT" autocomplete="off" spellcheck="false" required>
        </label>
        <label>
          <span>Content type</span>
          <input name="contentType" type="text" autocomplete="off" spellcheck="false">
        </label>
        <label>
          <span>Target filename</span>
          <input name="targetFilename" type="text" autocomplete="off" spellcheck="false">
        </label>
        <label class="checkbox">
          <input name="compress" type="checkbox" checked>
          <span>Compress</span>
        </label>
        <button class="button primary" type="submit">Publish file</button>
      </form>

      <form class="publish-form" id="directory-form" data-source-type="directory">
        <h2>Local directory insert</h2>
        <label>
          <span>Source path</span>
          <input name="sourcePath" type="text" autocomplete="off" spellcheck="false" required>
        </label>
        <label>
          <span>Insert URI</span>
          <input name="insertUri" type="text" autocomplete="off" spellcheck="false" required>
        </label>
        <label>
          <span>Identifier</span>
          <input name="identifier" type="text" autocomplete="off" spellcheck="false">
        </label>
        <label>
          <span>Compatibility mode</span>
          <input name="compatibilityMode" type="text" value="COMPAT_CURRENT" autocomplete="off" spellcheck="false" required>
        </label>
        <label class="checkbox">
          <input name="compress" type="checkbox" checked>
          <span>Compress</span>
        </label>
        <button class="button primary" type="submit">Publish directory</button>
      </form>
    </section>

    <p class="status" id="status" role="status" aria-live="polite"></p>
    <section class="result-panel" id="result">
      <p class="empty">Submit a local file or directory insert to queue a persistent upload.</p>
    </section>
  </main>
  <script src="./crypta-platform.js" defer></script>
  <script src="./app.js" defer></script>
</body>
</html>
